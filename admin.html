<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal HRIS — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root { --primary: #EA580C; }
    .nav-btn.active { background-color: #0F172A; color: #FFFFFF; font-weight: 600; }
    .dark .nav-btn.active { background-color: #F1F5F9; color: #0F172A; }
    .nav-btn.active .nav-num { color: #94A3B8; }
    .dark .nav-btn.active .nav-num { color: #64748B; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 font-sans antialiased">

  <!-- 1. LOGIN ADMIN / HR -->
  <div id="view-login" class="min-h-screen flex flex-col items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
      <div class="flex items-center gap-3 mb-5">
        <img id="login-logo" class="h-9 max-w-[140px] object-contain hidden" alt="Logo" />
        <div id="login-initials" class="w-9 h-9 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold text-sm shrink-0">VP</div>
        <div class="min-w-0">
          <p class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Portal HRIS</p>
          <h1 id="login-company" class="text-sm font-bold truncate">Veropsa People</h1>
        </div>
      </div>

      <h2 class="text-xl font-bold tracking-tight">Login Admin / HR</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-5">Masuk untuk mengelola operasional presensi & SDM.</p>

      <div id="login-msg" class="hidden mb-4 p-3 rounded-xl bg-rose-50 dark:bg-rose-500/15 border border-rose-200 dark:border-rose-500/30 text-rose-700 dark:text-rose-300 text-xs font-semibold"></div>

      <form onsubmit="handleHrLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5">Email Admin</label>
          <input type="email" id="hr-email" placeholder="nama@email.com" required class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-slate-400" />
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-600 dark:text-slate-400 mb-1.5">Password</label>
          <input type="password" id="hr-pass" placeholder="Password akun" required class="w-full px-3.5 py-2.5 text-sm rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:border-slate-400" />
        </div>
        <button type="submit" id="btn-hr-login" class="w-full py-2.5 rounded-xl text-sm font-semibold bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:opacity-90 transition-opacity">MASUK</button>
      </form>
    </div>
    <a href="/" class="mt-5 text-xs font-medium text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors">← Kembali ke Presensi Karyawan</a>
  </div>

  <!-- 2. DASHBOARD HR -->
  <div id="view-hr" class="hidden min-h-screen flex">
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 hidden lg:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-white dark:bg-slate-900 border-r border-slate-200/80 dark:border-slate-800 flex flex-col justify-between transform -translate-x-full lg:translate-x-0 transition-transform duration-200 shrink-0">
      <div class="overflow-y-auto flex-1">
        <div class="p-5 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/80">
          <div class="flex items-center gap-3 min-w-0">
            <img id="hr-logo" class="h-9 max-w-[130px] object-contain hidden" alt="Logo" />
            <div id="hr-initials" class="w-9 h-9 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold text-sm shrink-0">VP</div>
            <div class="min-w-0">
              <p id="hr-brand-kicker" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Veropsa People</p>
              <h1 id="hr-company" class="text-sm font-bold truncate leading-tight">-</h1>
            </div>
          </div>
          <button onclick="toggleMobileSidebar()" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Tutup menu">✕</button>
        </div>

        <nav class="p-3 space-y-6">
          <div>
            <p class="px-3 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Operasional</p>
            <div class="space-y-1">
              <button id="nav-dash" onclick="showHrPage('dash', this)" class="nav-btn active w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">01</span><span>Dashboard</span>
              </button>
              <button id="nav-pres" data-feature="people_presensi" onclick="showHrPage('pres', this)" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">02</span><span>Presensi & Rekap</span>
              </button>
              <button id="nav-req" data-feature="people_pengajuan" onclick="showHrPage('req', this)" class="nav-btn w-full flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="flex items-center gap-3"><span class="nav-num font-mono text-xs text-slate-400">03</span><span>Pengajuan & Izin</span></span>
                <span id="nav-req-badge" class="hidden px-1.5 py-0.5 text-[10px] font-bold rounded-md bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300">0</span>
              </button>
              <button id="nav-bpjs" data-feature="people_bpjs" onclick="showHrPage('bpjs', this)" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">04</span><span>Kontrol BPJS</span>
              </button>
            </div>
          </div>

          <div>
            <p class="px-3 mb-2 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Master & Sistem</p>
            <div class="space-y-1">
              <button id="nav-emp" onclick="showHrPage('emp', this)" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">05</span><span>Master Karyawan</span>
              </button>
              <button id="nav-loc" onclick="showHrPage('loc', this)" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">06</span><span>Lokasi Penempatan</span>
              </button>
              <button id="nav-set" onclick="showHrPage('set', this)" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-lg text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <span class="nav-num font-mono text-xs text-slate-400">07</span><span>Pengaturan</span>
              </button>
            </div>
          </div>
        </nav>
      </div>

      <!-- COMPACT PROFILE FOOTER -->
      <div class="p-3 border-t border-slate-100 dark:border-slate-800/80">
        <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60">
          <div class="flex items-center gap-2.5 min-w-0">
            <div class="w-8 h-8 rounded-lg bg-slate-900 dark:bg-slate-700 text-white flex items-center justify-center text-xs font-bold shrink-0">HR</div>
            <div class="min-w-0">
              <p class="text-xs font-semibold truncate">Admin HR</p>
              <p id="hr-user-email" class="text-[11px] text-slate-500 dark:text-slate-400 truncate">-</p>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button onclick="toggleTheme()" title="Mode Gelap / Terang" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 hover:bg-white dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-700">
              <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
              <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
            </button>
            <button onclick="logoutHr()" title="Keluar" class="p-1.5 rounded-lg text-slate-500 hover:text-rose-600 hover:bg-rose-50 dark:text-slate-400 dark:hover:text-rose-400 dark:hover:bg-rose-500/10">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            </button>
          </div>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 min-w-0 flex flex-col">
      <!-- MOBILE BAR -->
      <div class="lg:hidden sticky top-0 z-20 bg-white/90 dark:bg-slate-900/90 backdrop-blur-sm border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <button onclick="toggleMobileSidebar()" class="p-2 -ml-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800" aria-label="Buka menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <span id="hr-mobile-title" class="font-bold text-sm">Veropsa People</span>
        </div>
        <button onclick="toggleTheme()" class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800">◐</button>
      </div>

      <div class="p-4 sm:p-6 lg:p-8 max-w-7xl w-full mx-auto space-y-6">

        <!-- 01 / DASHBOARD -->
        <section id="page-dash" class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
            <div>
              <div class="flex items-center gap-2 text-xs font-medium text-slate-500 mb-1"><span class="font-mono text-slate-400">01</span><span>/</span><span>Ringkasan</span></div>
              <h2 class="text-2xl font-bold tracking-tight">Dashboard HRIS</h2>
            </div>
            <button onclick="loadHrData(true)" class="self-start sm:self-auto px-4 py-2 rounded-xl text-sm font-medium bg-slate-900 dark:bg-white text-white dark:text-slate-900 hover:opacity-90">↻ Muat Ulang</button>
          </div>

          <div class="grid grid-cols-2 lg:grid-cols-
